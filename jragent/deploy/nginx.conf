# 策略体检所 · Nginx 配置
# 用法：放到 /etc/nginx/conf.d/quant.conf，然后 nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name your-domain.com;        # 改成你的域名或穿透域名

    # 前端打包产物，服务器上不需要跑 Node
    root /opt/jragent/frontend/dist;
    index index.html;

    # 单页应用 history 路由必须配这个，否则刷新 /strategies 会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ⚠️ 关键：AI 流式输出必须关缓冲，否则会整段卡住最后一次性喷出来
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;         # 工具循环可能跑几十秒
    }

    # 静态资源（收款码等）
    location /static/ {
        alias /opt/jragent/backend/static/;
        expires 1d;
    }

    client_max_body_size 2m;             # 限制上传体积，防止超长文本打爆 token
}
